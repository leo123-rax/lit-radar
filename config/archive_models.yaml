# Archive instrument vocabulary per gazetteer entity, used by `litradar timeseries`.
#
# Keys are entity ids from config/instruments.yaml. For each entity:
#   sra         SRA Properties-index strings: SRA's own instrument_model spelling in LOWER CASE, queried as
#               "instrument <string>"[Properties]. The match is on the whole string ("instrument illumina
#               novaseq x" does not include "... x plus"), so list every sub-model you want counted.
#   ena         ENA portal `instrument_model` values: the exact vocabulary strings (matching is case-insensitive, but
#               "PacBio Revio" is not a vocabulary value and returns 0). SRA and ENA share the controlled vocabulary in
#               SRA.common.xsd (github.com/enasequence/schema), so `ena` is the mixed-case twin of `sra`.
#               ENA's count endpoint returns experiment-RUN rows (runs), SRA counts experiments; the outputs say so.
#   epmc_terms  Phrases searched in Europe PMC Methods sections (METHODS:"..."), OR-ed into one query per entity;
#               the hit count is papers, not mentions. Europe PMC phrase search is prefix-inclusive at the token
#               level ("NovaSeq X" also matches "NovaSeq X Plus") and case-insensitive, so every term must be
#               VENDOR-QUALIFIED or a brand token that is not an ordinary word: "Vega system" matched knee implants,
#               MRI software and astronomy (29 of 29 hits before 2025 were not sequencers); "Revio" alone matched a
#               robotics paper (REVIO odometry); "UG 100" alone would match "10 ug 100 uL" in a buffer recipe.
#               Use "PacBio Vega" / "Vega sequencer", not "Vega"; "NovaSeq", "MinION", "DNBSEQ" are safe brand tokens.
#   launch      YYYY-MM the model was announced. Months before it are stored as 0 without a request (nothing can
#               deposit from or name an instrument that did not exist; Europe PMC phrase hits before the launch were
#               only ever false positives). Optional; use the announcement month, which precedes shipping.
#   vendor      fallback for `--vendor` expansion when the id is not (yet) in instruments.yaml.
#   proposed    true = the id is pre-registered here but the gazetteer entry still has to be added to
#               instruments.yaml (the time series works without it; `litradar check-config` and the `warnings`
#               array of `litradar timeseries` list it, and tell you when the flag has become stale).
#
# Vocabulary verified live against SRA esearch, ENA /count and SRA.common.xsd on 2026-10-17. Models in the
# schema with no gazetteer entry and therefore not covered: Illumina MiniSeq, Ultima UG 200, Genapsys, GeneMind,
# Vela Sentosa, capillary and 454 instruments. Oxford Nanopore sub-models (PromethION 2 Solo, MinION Mk1C, Flongle)
# are not archive instrument_model values; they are only reachable through Europe PMC terms.
#
# Changing an entity's epmc_terms changes its series key: cached months under the old term set stay in the
# `timeseries` table but leave the outputs, and the new set is fetched on the next run.
entities:
  # ---------------- Pacific Biosciences ----------------
  pacb-rs-ii:
    vendor: Pacific Biosciences
    sra: ["pacbio rs ii", "pacbio rs"]
    ena: ["PacBio RS II", "PacBio RS"]
    epmc_terms: ["PacBio RS II", "PacBio RSII", "PacBio RS"]
    notes: "legacy SMRT instruments (2011-2016); 'RS II system' dropped (unqualified)"
  pacb-sequel:
    vendor: Pacific Biosciences
    sra: ["sequel"]
    ena: ["Sequel"]
    epmc_terms: []
    notes: "first-generation Sequel (gazetteer entry landed 2026-10-17); Europe PMC cannot separate 'Sequel' from 'Sequel II' (prefix match), so no epmc terms"
  pacb-sequel-ii:
    vendor: Pacific Biosciences
    sra: ["sequel ii", "sequel iie"]
    ena: ["Sequel II", "Sequel IIe"]
    epmc_terms: ["PacBio Sequel II", "Sequel II system", "Sequel II sequencer", "Sequel II platform", "Sequel IIe"]
    notes: "'Sequel II' alone is an ordinary phrase; 'Sequel IIe' is a brand token and stays bare; no launch floor (early-access deposits reached SRA in 2019-03, before the April 2019 launch)"
  pacb-revio:
    vendor: Pacific Biosciences
    sra: ["revio"]
    ena: ["Revio"]
    epmc_terms: ["PacBio Revio", "Revio system", "Revio sequencer", "Revio platform", "Revio SMRT"]
    launch: 2022-10
    notes: "announced 2022-10-25; bare 'Revio' matched 'REVIO: Range- and Event-Based Visual-Inertial Odometry' (2022-10)"
  pacb-vega:
    vendor: Pacific Biosciences
    sra: ["vega"]
    ena: ["Vega"]
    epmc_terms: ["PacBio Vega", "Vega sequencer"]
    launch: 2024-11
    notes: "announced 2024-11; in the SRA/ENA vocabulary since 2025; zero deposits as of 2026-10-17; 'Vega system' dropped (knee implants, MRI software, astronomy)"
  pacb-onso:
    vendor: Pacific Biosciences
    sra: ["onso"]
    ena: ["Onso"]
    epmc_terms: ["PacBio Onso", "Onso system", "Onso sequencer"]
    launch: 2022-10
    notes: "announced 2022-10-25 with Revio"
  # ---------------- Oxford Nanopore ----------------
  ont-promethion:
    vendor: Oxford Nanopore Technologies
    sra: ["promethion"]
    ena: ["PromethION"]
    epmc_terms: ["PromethION"]
  ont-gridion:
    vendor: Oxford Nanopore Technologies
    sra: ["gridion"]
    ena: ["GridION"]
    epmc_terms: ["GridION"]
  ont-minion:
    vendor: Oxford Nanopore Technologies
    sra: ["minion"]
    ena: ["MinION"]
    epmc_terms: ["MinION", "Flongle"]
    notes: "Flongle is a flow-cell adapter, not an archive instrument_model; counted via Europe PMC only"
  # ---------------- Illumina ----------------
  ilmn-hiseq:
    vendor: Illumina
    sra: ["illumina hiseq 2500", "illumina hiseq 4000", "illumina hiseq x", "hiseq x ten", "hiseq x five",
          "illumina hiseq 3000", "illumina hiseq 2000", "illumina hiseq 1500", "illumina hiseq 1000"]
    ena: ["Illumina HiSeq 2500", "Illumina HiSeq 4000", "Illumina HiSeq X", "HiSeq X Ten", "HiSeq X Five",
          "Illumina HiSeq 3000", "Illumina HiSeq 2000", "Illumina HiSeq 1500", "Illumina HiSeq 1000"]
    epmc_terms: ["HiSeq", "HiSeq2500", "HiSeq4000"]
  ilmn-novaseq-6000:
    vendor: Illumina
    sra: ["illumina novaseq 6000"]
    ena: ["Illumina NovaSeq 6000"]
    epmc_terms: ["NovaSeq 6000", "NovaSeq6000"]
  ilmn-novaseq-x:
    vendor: Illumina
    sra: ["illumina novaseq x"]
    ena: ["Illumina NovaSeq X"]
    epmc_terms: ["NovaSeq X", "NovaSeqX"]
    launch: 2022-09
    notes: "announced 2022-09-29; archive strings keep X and X Plus apart (split 2026-10-17). Europe PMC phrase search is prefix-inclusive, so the 'NovaSeq X' term also counts X Plus papers: the epmc series of this id is the NovaSeq X family, the epmc series of ilmn-novaseq-x-plus is the Plus subset"
  ilmn-novaseq-x-plus:
    vendor: Illumina
    sra: ["illumina novaseq x plus"]
    ena: ["Illumina NovaSeq X Plus"]
    epmc_terms: ["NovaSeq X Plus", "NovaSeqX Plus"]
    launch: 2022-09
    notes: "announced 2022-09-29 with the NovaSeq X; SRA deposits from 2023-10, ENA vocabulary added 2024-12"
  ilmn-nextseq-550:
    vendor: Illumina
    sra: ["nextseq 500", "nextseq 550"]
    ena: ["NextSeq 500", "NextSeq 550"]
    epmc_terms: ["NextSeq 500", "NextSeq 550", "NextSeq500", "NextSeq550"]
  ilmn-nextseq-1000:
    vendor: Illumina
    sra: ["nextseq 1000"]
    ena: ["NextSeq 1000"]
    epmc_terms: ["NextSeq 1000", "NextSeq1000"]
  ilmn-nextseq-2000:
    vendor: Illumina
    sra: ["nextseq 2000"]
    ena: ["NextSeq 2000"]
    epmc_terms: ["NextSeq 2000", "NextSeq2000"]
  ilmn-miseq:
    vendor: Illumina
    sra: ["illumina miseq"]
    ena: ["Illumina MiSeq"]
    epmc_terms: ["MiSeq"]
  ilmn-miseq-i100:
    vendor: Illumina
    sra: []
    ena: []
    epmc_terms: ["MiSeq i100"]
    launch: 2024-10
    notes: "announced 2024-10; not in the archive vocabulary as of 2026-10-17; papers only"
  ilmn-iseq-100:
    vendor: Illumina
    sra: ["illumina iseq 100"]
    ena: ["Illumina iSeq 100"]
    epmc_terms: ["iSeq 100", "iSeq100"]
  # ---------------- Element Biosciences ----------------
  elem-aviti:
    vendor: Element Biosciences
    sra: ["element aviti"]
    ena: ["Element AVITI"]
    epmc_terms: ["AVITI"]
    launch: 2022-03
    notes: "announced 2022-03"
  elem-aviti24:
    vendor: Element Biosciences
    sra: ["aviti 24"]
    ena: ["AVITI 24"]
    epmc_terms: ["AVITI24", "AVITI 24"]
    launch: 2024-01
    notes: "announced 2024-01; in the vocabulary; zero SRA deposits as of 2026-10-17"
  # ---------------- Ultima Genomics ----------------
  ultima-ug100:
    vendor: Ultima Genomics
    sra: ["ug 100"]
    ena: ["UG 100"]
    epmc_terms: ["UG100", "Ultima UG 100", "UG 100 sequencer", "UG 100 platform", "Ultima Genomics"]
    launch: 2022-05
    notes: "company unveiled 2022-05; bare 'UG 100' dropped (case-insensitive match on '... ug 100 uL' buffer recipes)"
  # ---------------- MGI Tech ----------------
  mgi-dnbseq-t7:
    vendor: MGI Tech
    sra: ["dnbseq-t7"]
    ena: ["DNBSEQ-T7"]
    epmc_terms: ["DNBSEQ-T7", "MGISEQ-T7"]
  mgi-dnbseq-g400:
    vendor: MGI Tech
    sra: ["dnbseq-g400", "dnbseq-g400 fast", "mgiseq-2000rs"]
    ena: ["DNBSEQ-G400", "DNBSEQ-G400 FAST", "MGISEQ-2000RS"]
    epmc_terms: ["DNBSEQ-G400", "MGISEQ-2000"]
  mgi-dnbseq-g99:
    vendor: MGI Tech
    sra: []
    ena: []
    epmc_terms: ["DNBSEQ-G99"]
    notes: "not in the archive vocabulary as of 2026-10-17; papers only"
  mgi-dnbseq-t20:
    vendor: MGI Tech
    sra: []
    ena: []
    epmc_terms: ["DNBSEQ-T20"]
    notes: "not in the archive vocabulary as of 2026-10-17; papers only"
  mgi-dnbseq:
    vendor: MGI Tech
    sra: ["bgiseq-500", "bgiseq-50", "dnbseq-g50", "dnbseq-g800", "dnbseq-t10x4rs"]
    ena: ["BGISEQ-500", "BGISEQ-50", "DNBSEQ-G50", "DNBSEQ-G800", "DNBSEQ-T10x4RS"]
    epmc_terms: ["BGISEQ-500", "BGISEQ", "DNBSEQ", "MGISEQ"]
    notes: "generic / remaining MGI and BGI models"
  # ---------------- Thermo Fisher Ion Torrent ----------------
  thermo-ion-torrent:
    vendor: Thermo Fisher Scientific
    sra: ["ion torrent pgm", "ion torrent proton", "ion torrent s5", "ion torrent s5 xl", "ion torrent genexus",
          "ion genestudio s5", "ion genestudio s5 prime", "ion genestudio s5 plus"]
    ena: ["Ion Torrent PGM", "Ion Torrent Proton", "Ion Torrent S5", "Ion Torrent S5 XL", "Ion Torrent Genexus",
          "Ion GeneStudio S5", "Ion GeneStudio S5 Prime", "Ion GeneStudio S5 Plus"]
    epmc_terms: ["Ion Torrent", "Ion S5", "Ion Proton", "Ion PGM", "Ion GeneStudio", "Genexus"]
