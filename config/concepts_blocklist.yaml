# Clinical / anatomy blocklist for the emerging-concepts surfacer (litradar/concepts.py, loaded by load_exclusions).
#
# The surfacer promises methods, assays, modalities and model classes. Disease names, anatomy, study populations,
# outcome measures and regulators are real biomedical phrases that its capitalised-run and hyphen channels pick up
# from titles, so they are dropped at extraction time. This file ADDS to the built-in lists in concepts.py
# (CLINICAL_PHRASES / CLINICAL_HEAD_WORDS); it never removes anything. Curated seed anchors (-seq, -omics, editing,
# organoid, ...) are exempt, so "disease model" or "patient-derived organoid" still count.
#
#   clinical_phrases    whole phrases, matched after normalisation (lower case, dashes to spaces, plural of the
#                       last word singularised): "Prefrontal Cortex" and "prefrontal cortices" both hit "prefrontal cortex"
#   clinical_head_words a phrase whose LAST word is listed is clinical ("tumor hypoxia", "renal artery");
#                       "disease", "cancer" and "tumor" are deliberately absent because "minimal residual disease",
#                       "cancer genome atlas" and "circulating tumor DNA" are concepts the radar tracks
#   generic_phrases     boilerplate that is not a concept in any channel (added to the exact exclusion set)
#
# Edit freely, then run `litradar concepts --force` so every week is recounted with the new rules.

clinical_phrases:
