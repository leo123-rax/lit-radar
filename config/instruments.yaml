# Instrument / platform / kit gazetteer. The text-matcher turns each alias into a word-bounded regex.
#   id            stable key used in the database
#   name          canonical display name (also matched)
#   vendor        maker (current owner); parent = acquirer when the brand survived an acquisition
#   ticker        public ticker of the current owner, or "private"
#   category      sequencer.short_read | sequencer.long_read | single_cell | spatial | proteomics.affinity |
#                 proteomics.ms | library_prep | synthesis | pcr | array | cytometry | cryo_em | imaging |
#                 automation | cell_engineering | bioprocess | qc | software | reagent
#   aliases       spellings seen in Methods sections. Spaces/hyphens inside an alias are matched loosely.
#   context_required  true -> only count the hit if a context term (vendor by default) is within ~250 chars
#   context_terms     override the context terms
#   case_sensitive_aliases  aliases that must match case exactly (short / dictionary-word tokens)
# Launch years are approximate commercial availability; status: current | discontinued.
