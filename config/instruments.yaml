# Instrument / platform / kit gazetteer. The text-matcher turns each alias into a word-bounded regex.
#   id            stable key used in the database
#   name          canonical display name (also matched)
#   vendor        maker (current owner); parent = acquirer when the brand survived an acquisition
#   ticker        public ticker of the current owner, or "private"
#   category      sequencer.short_read | sequencer.long_read | single_cell | spatial | proteomics.affinity |
#                 proteomics.ms | library_prep | synthesis | pcr | array | cytometry | cryo_em | imaging |
#                 automation | cell_engineering | bioprocess | qc | software | reagent
#   aliases       spellings seen in Methods sections. Spaces/hyphens inside an alias are matched loosely.
#   context_required  true -> only count the hit if a context term (vendor by default) is within ~250 chars
#   context_terms     override the context terms
#   case_sensitive_aliases  aliases that must match case exactly (short / dictionary-word tokens); the matcher ALSO
#                           requires a context term for every alias listed here, so give such entries context_terms
# Launch years are approximate commercial availability; status: current | discontinued.
#
# Curation rules (see docs/gazetteer.md for the long form):
#   * software (FlowJo, ZEN, Cell Ranger, Imaris, ...) lives in its own `software` entry and never credits hardware;
#   * reagents and consumables (TaqMan, Lipofectamine, Sepharose, Transwell, ...) live in `reagent` entries;
#   * a bare company name is an instrument alias only when the vendor sells a single platform (Oxford Nanopore,
#     SCIEX, Gatan, Covaris, ...); otherwise the company gazetteer counts it as a supplier;
#   * any alias that is an English dictionary word or a 2-4 letter token must be case-sensitive (and therefore
#     context-gated) or belong to a context_required entry -- tests/test_gazetteer.py enforces this;
#   * prefer phrase aliases ("Xenium spatial", "MinION flow cell") over gating when recall matters.
