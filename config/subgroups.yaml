# Researcher subgroups. Each subgroup carries:
#   openalex_topics   OpenAlex topic ids (T...) used to pull new works and to assign papers to the subgroup.
#   keywords          free-text terms used when no topic id is available and for assigning papers.
#   tracked_authors   people whose new papers / preprints you want flagged. Match by OpenAlex author id
#                     (preferred, unambiguous) or by exact display name.
