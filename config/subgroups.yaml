# Researcher subgroups. Each subgroup carries:
#   openalex_topics   OpenAlex topic ids (T...) used to pull new works and to assign papers to the subgroup.
#                     First id(s) = primary topic for the field; the rest are supporting topics (often broad —
#                     e.g. T10222 has ~700k works — so pair them with keywords rather than relying on them alone).
#                     OpenAlex has no dedicated topic for perturbation screens, protein design, long-read
#                     sequencing or MCED; those subgroups are defined by keywords intersected with broad topics.
#   keywords          free-text terms used when no topic id is available and for assigning papers.
#   tracked_authors   people whose new papers / preprints you want flagged. Match by OpenAlex author id
#                     (preferred, unambiguous) or by exact display name. An empty openalex_id means the id
#                     could not be resolved yet (split profile, common name, or budget) — resolve via ORCID.
# The illustrative seed list below names well-known public researchers in each field. Edit freely.
