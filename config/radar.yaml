# lit-radar main configuration. Everything here is safe to commit; secrets go in .env.

window_days: 7          # default look-back for `litradar run`
timezone: UTC

sources:
  biorxiv:
    enabled: true
    servers: [biorxiv, medrxiv]
    # bioRxiv subject categories to keep (lower-case, as the API spells them). Empty = all.
    categories:
      - genomics
      - genetics
      - bioinformatics
      - systems biology
      - synthetic biology
      - cancer biology
      - cell biology
      - molecular biology
      - biochemistry
      - bioengineering
      - immunology
      - microbiology
      - pathology
      - developmental biology
      - neuroscience
      - biophysics
      - evolutionary biology
      - plant biology
      - pharmacology and toxicology
    medrxiv_categories:
      - oncology
      - genetic and genomic medicine
      - pathology
      - hematology
      - infectious diseases
      - health informatics
    # Full-text JATS XML is OFF by default: www.biorxiv.org / www.medrxiv.org rate-limit scripted clients
    # (HTTP 429, Cloudflare error 1015) after a handful of requests, and the client then blocks the host
    # for the run, so a 600-paper cap produced ~570 failures and a 30 s Retry-After sleep per run. The
    # official bulk route is the requester-pays S3 bucket (s3://biorxiv-src-monthly, MECA archives;
    # see docs/sources/biorxiv.md for how to enable this flag and the S3 path). Europe PMC carries the
    # open-access subset of preprints with full text, and Methods-level matching still works through it.
    fulltext: false
    fulltext_max: 600       # cap per run when enabled (each is one request; cached on disk afterwards)

  europepmc:
    enabled: true
    journals: true          # new articles in config/journals.yaml by ISSN
    methods_search: true    # open-access papers whose METHODS section names a gazetteer instrument
    # only these gazetteer categories are used to PULL papers (every category is still annotated)
    methods_search_categories: [sequencer, single_cell, spatial, proteomics, synthesis, cryo_em, array, cell_engineering]
    coi_search: true        # open-access papers whose competing-interests / funding sections name a watched company
    fulltext: true
    fulltext_max: 400
    max_records_per_query: 3000

  openalex:
    enabled: true
    topics: true            # new works in the OpenAlex topics listed in config/subgroups.yaml
    company_authors: true   # new works with a company-affiliated author in those topics
    tracked_authors: true   # new works by the authors listed in config/subgroups.yaml
    journals: true          # ISSN coverage as a Crossref/Europe PMC backstop
    max_records_per_query: 2000

  crossref:
    enabled: true           # per-journal DOI feeds (fast, metadata only)

  arxiv:
    enabled: true
    categories: [q-bio.GN, q-bio.QM, q-bio.BM, q-bio.MN, q-bio.CB, q-bio.TO, q-bio.SC]

  sra:
    enabled: true           # NCBI SRA census of newly public sequencing experiments and the instrument model declared
    max_records: 150000     # a full week is ~120k experiments (~240 requests); lower this to sample

  ena:
    enabled: true           # ENA/DDBJ-submitted records (ERX/DRX) appear here before NCBI mirrors them
    limit: 0                # 0 = all records in the window

  sec:
    enabled: true           # SEC EDGAR 8-K Atom feed for every watched company with a plain US ticker.
                            # Requires LITRADAR_CONTACT_EMAIL: EDGAR wants "<tool> <contact e-mail>" (no URL) in
                            # the User-Agent and answers 403 otherwise; feeds are skipped with a warning without it.

  rss:
    enabled: true           # journal TOCs that lack ISSN coverage, trade press, press wires (config/feeds.yaml)

  # ---- additional archives (study-level censuses; every record passes through the instrument gazetteer) ----
  geo:
    enabled: true           # NCBI GEO: newly released Series (GSE) and the platform (GPL) each ran on
    max_records: 20000      # a week is ~500 series = 3 esummary pages + ~3 platform lookups (~8 requests, ~5 MB)
    sequencing_only: true   # adds "high-throughput sequencing"[PTYP] to the esearch; false also pulls microarray / in-situ series

  pride:
    enabled: true           # PRIDE Archive: proteomics datasets made public, one record per declared mass spectrometer
    max_projects: 0         # 0 = every project in the window (one request per day of the window)

  cellxgene:
    enabled: true               # CZ CELLxGENE Discover: curated single-cell / spatial datasets with the assay (one ~10 MB request)
    include_revisions: false    # also count datasets whose latest revision landed in the window
    max_records: 0              # 0 = all assay rows in the window
    max_collection_details: 50  # fallback route only: cap on per-collection detail requests

  # ---- signals (grants, trials, device decisions) rendered in their own digest section ----
  nih_reporter:
    enabled: true           # NIH RePORTER: S10 shared-instrumentation awards + awards naming a platform or watched company
    s10: true
    keywords: true
    max_terms: 150          # cap on gazetteer terms used in keyword queries (25 terms per request)
    max_records: 2000       # per query family
    decorate_titles: true   # "title — organisation (S10, $amount)"

  clinicaltrials:
    enabled: true           # ClinicalTrials.gov v2: studies first posted in the window matching sponsors / interventions
    sponsor_terms: []       # Essie terms matched against sponsor / collaborator names; empty = every company with watch_news: true
    intervention_terms: []  # matched against intervention / arm names; empty = the watchlist_terms above
    terms: []               # optional free-text ("other terms") area; higher recall, lower precision
    max_records: 2000

  openfda:
    enabled: true             # FDA 510(k) clearances, De Novo grants, PMA decisions via api.fda.gov (OPENFDA_API_KEY optional)
    kinds: [510k, pma]        # 510k also yields the fda-denovo feed
    lookback_days: 45         # the datasets refresh MONTHLY; the look-back must exceed one refresh interval (60 is safer)
    advisory_committees: [CH, HE, IM, MI, PA, TX, MG]   # in-vitro diagnostics only; [] = every device
    include_supplements: true
    exclude_supplement_types: ["30-Day Notice"]   # manufacturing-change notices are ~half of PMA decisions
    watched_applicants_only: true   # keep only decisions whose applicant / device text names a gazetteer company
    max_records: 5000

  semantic_scholar:
    enabled: true           # citation counts + influential citations + TLDR for stored papers with DOIs (runs before ranking)
    whole_store: false      # true = refresh every stored paper each run (1 request per 500 DOIs)
    lookback_days: 365      # enrich papers published / first seen within this many days before the run window
    max_papers: 5000        # cap per run; newest first (1 request per 500 DOIs -> at most 10 requests)

# Free-text terms that lift a paper's score when they appear in the title/abstract.
# Edit freely; these describe what you care about, not what the matcher knows.
watchlist_terms:
  - single-cell
  - spatial transcriptomics
  - spatial proteomics
  - long-read
  - telomere-to-telomere
  - cell-free DNA
  - ctDNA
  - minimal residual disease
  - multi-cancer early detection
  - proteomics
  - perturb-seq
  - CRISPR screen
  - base editing
  - prime editing
  - foundation model
  - protein design
  - antibody discovery
  - cryo-EM
  - DNA synthesis
  - DNA data storage
  - methylation
  - liquid biopsy
  - whole-genome sequencing
  - newborn sequencing
  - cell atlas

ranking:
  weights: {}               # override any key from litradar/rank/heuristics.py DEFAULT_WEIGHTS
  llm:
    enabled: false          # or pass --llm on the command line
    min_heuristic: 3.0      # only papers at/above this heuristic score are sent to the model
    max_items: 300
    use_batch: true
    llm_weight: 0.6         # final = 0.4 * heuristic + 0.6 * llm composite

news:
  # Per-company news comes from the GDELT DOC 2.0 API (api.gdeltproject.org), which is built for
  # programmatic use (GDELT: "unlimited and unrestricted use for any academic, commercial, or governmental
  # use"). The query is "<company name>" + the query_context clause for the company type (or the company's
  # own news_query), with sourcelang:<gdelt_language>. GDELT allows one request every 5 seconds, so ~75
  # watched companies take ~7 minutes; a 429 backs the client off and, if it persists, the remaining
  # companies are skipped and reported in the digest's error list. GDELT returns no snippet and mostly
  # mainstream/regional outlets, so it complements publisher RSS, press wires and SEC filings.
  gdelt: true
  gdelt_timespan: 7d          # GDELT window (15min .. 3m); keep aligned with window_days
  gdelt_language: english     # sourcelang: filter; empty string = all languages
  # Google News RSS is OPT-IN and off by default. news.google.com/robots.txt serves "User-agent: * /
  # Disallow: /" with an allow-list that omits /rss, and Google's Terms of Service prohibit "using automated
  # means to access content from any of our services in violation of the machine-readable instructions on
  # our web pages (for example, robots.txt files that disallow crawling...)". Turning this on is the fork
  # owner's decision and risk; when on, one query per watched company plus the gnews entries in
  # config/feeds.yaml are fetched (titles + encoded links only, `when:7d` appended to every query).
  google_news: false
  # Query context clauses are "<company name>" + a clause chosen by company type, so bare names like GRAIL
  # or Roche do not pull unrelated stories. Override per company with news_query in companies.yaml.
  # GDELT requires OR groups to be parenthesised; keep the parentheses.
  query_context:
    tools: '(sequencing OR genomics OR proteomics OR "life sciences" OR instrument OR biotech)'
    diagnostics: '(cancer OR diagnostic OR test OR genomics OR biotech OR FDA OR Medicare)'
    synthesis: '(DNA OR "synthetic biology" OR biotech OR genomics)'
    ai_bio: '(AI OR "drug discovery" OR protein OR biology OR biotech)'
    pharma: '(FDA OR trial OR drug OR pharma OR biotech)'
    cro: '(biotech OR pharma OR CDMO OR laboratory)'
    institute: '(research OR genomics OR biology)'
  # headlines matching any of these regexes are dropped (insider-sale filings and stock-screener chatter)
  exclude_title_patterns:
    - '\bForm (4|144|13[FG]|3)\b'
    - '\b(insider|director|officer|CEO|CFO|COO|president|chairman)\b.*\b(sells?|sold|buys?|bought|purchases?|acquires?)\b.*\b(shares?|stock)\b'
    - '\bsells? \$?[0-9.,]+[km]? (in|of) (stock|shares)\b'
    - 'GF Score|MarketBeat|Stock Titan|Fair Value|Zacks|Motley Fool|Seeking Alpha|Simply Wall St|Benzinga|TipRanks'
    - '\b(stock|shares) (sees?|falls?|rises?|jumps?|slides?|gains?|drops?|climbs?|soars?|plunges?)\b'
    - 'price target|analyst rating|rating (to|at) (buy|hold|sell)|options? (activity|trading)'

digest:
  top_n: 25
  concepts_n: 15            # emerging-concepts rows
  candidates_n: 15          # companies spotted but not yet tracked
  trend_weeks: 13           # baseline for the what-changed section
  trend_top_n: 10
  instruments_table_n: 40
  companies_table_n: 40
  archive_table_n: 30
  news_n: 40
  title: "Science literature radar"

# Optional real-browser fetcher for hosts that block scripted clients but serve open-licensed content
# (bioRxiv/medRxiv full-text XML). Needs `pip install 'lit-radar[browser]'` and either a running Chrome started
# with --remote-debugging-port=9222 or a persistent Chromium profile. See docs/browser.md and docs/LEGAL.md.
browser:
  enabled: false
  cdp_url: http://localhost:9222
  allowed_hosts: [www.biorxiv.org, www.medrxiv.org]
  min_interval: 5          # seconds between page loads per host
  max_pages: 150           # per run

# Coverage priorities written by `litradar prioritize` (kind -> {target: weight}); 1.0 = neutral.
priorities: {}

# Name-only tracked-author matches are capped per name per run (common names); id matches are not.
tracked_authors:
  name_match_cap: 5
