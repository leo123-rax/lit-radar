# Company gazetteer. Matched in affiliations, funding, competing-interest and acknowledgement
# sections, titles/abstracts, and author e-mail domains. 'parent' = current owner for acquired brands.
#   type: tools | diagnostics | synthesis | ai_bio | pharma | cro | institute | software
#         software = AI labs / model and pipeline vendors whose names appear as tools used in a paper, not as
#         subjects (OpenAI, Anthropic, Google DeepMind/AlphaFold, NVIDIA, Microsoft Research)
#   case_sensitive_aliases / context_terms work exactly as in instruments.yaml: a case-sensitive alias (and any
#         2-3 letter token) only counts when a context term is within ~250 chars; context_terms gate nothing else.
#   Pharma entries whose short name is gated carry conflict-of-interest vocabulary (honoraria, consulting, fees,
#         grants, ...) in context_terms so they still fire inside COI / funding lists.
#   ticker: public ticker of the current owner, or "private"
#   watch_news: true -> the digest also pulls a Google News RSS query for this name
#   domains: e-mail domains that identify a corporate author
entries:
