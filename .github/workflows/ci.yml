# Offline test suite. It references no secrets, so pull requests from forks are safe to run: a fork PR
# receives a read-only GITHUB_TOKEN and no repository secrets anyway, and this workflow asks for neither.
# Actions are pinned to full commit SHAs (tag in the comment).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: No database, WAL, cache, snapshot or env file may be tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '\.(sqlite|sqlite-wal|sqlite-shm|sqlite-journal|db|zst)$|^\.env($|\.)|^\.cache/|^site/|^digests/_work/' | grep -vx '.env.example' || true)
          if [ -n "$bad" ]; then printf '::error::tracked runtime or secret files:\n%s\n' "$bad"; exit 1; fi
      - run: ruff check .
      - run: python -m litradar check-config
      - run: python -m pytest -p no:warnings  # -q comes from pyproject.toml; a second -q would hide the "N passed" line
